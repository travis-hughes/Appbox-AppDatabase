services:
  filebrowser:
    container_name: filebrowser-quantum
    image: gtstef/filebrowser:stable
    restart: unless-stopped
    environment:
      - FILEBROWSER_ADMIN_PASSWORD=$GLOBAL_DEFAULT_PASSWORD
    networks:
      - appbox
    volumes:
      - $GLOBAL_STORAGE_PATH:/folder
      - $GLOBAL_STORAGE_PATH/AppData/filebrowser-quantum:/home/filebrowser/data
    ports:
      - $GLOBAL_IP:81:80

networks:
  appbox:
    name: appbox
    external: true