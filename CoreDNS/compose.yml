services:
  coredns:
    container_name: $GLOBAL_APP_NAME
    image: dokku/coredns-docker:latest
    command: -conf /Corefile
    restart: unless-stopped
    networks:
      - appbox
    ports:
      - $GLOBAL_IP:53:53/tcp
      - $GLOBAL_IP:53:53/udp
    volumes:
      - /var/run/docker.sock:var/run/docker.sock:ro
    configs:
      - source: Corefile
        target: /Corefile

configs:
  Corefile:
    content: |
      appbox.:53 {
        docker {
          zone appbox.
          networks bridge appbox 
        }

        template ANY A {
          match "^(.*\.)?appbox\.$"
          answer "{{ .Name }} 60 IN A $IP_ADDRESS"
          fallthrough
        }

        hosts {
          $IP_ADDRESS appbox
        }

        errors
        log
      }

      .:53 {
          forward . 172.30.0.100 1.1.1.1 8.8.8.8
          cache 30
          errors
          log
      }


networks:
  appbox:
    name: appbox
    external: true